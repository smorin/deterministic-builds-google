<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Environment, N Machines</title>
<meta name="description" content="Deterministic builds for humans and agents. Google 2026. 25 minute talk deck with emulated terminal demos.">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121721;
    --panel-2: #192030;
    --line: #273042;
    --text: #e8edf5;
    --muted: #8d98ab;
    --dim: #5b667a;
    --accent: #f6b73c;
    --green: #4ade80;
    --purple: #b48cff;
    --blue: #7cc4ff;
    --red: #ff7b72;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  #stage-wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { width: 1600px; height: 900px; position: relative; transform-origin: center center; }
  .slide { position: absolute; inset: 0; padding: 72px 96px; display: none; flex-direction: column; }
  .slide.type-term, .slide.type-term3 { padding: 44px 72px; }
  .slide.active { display: flex; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none;} }

  .kicker { font-family: var(--mono); color: var(--accent); font-size: 22px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 18px; }
  h1 { font-size: 84px; line-height: 1.02; margin: 0 0 24px; font-weight: 700; letter-spacing: -0.02em; }
  h2 { font-size: 56px; line-height: 1.08; margin: 0 0 36px; font-weight: 700; letter-spacing: -0.015em; }
  .sub { font-size: 34px; color: var(--muted); line-height: 1.35; max-width: 1200px; }
  .fill { flex: 1; }
  .foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 22px; font-family: var(--mono); }

  /* title */
  .slide.type-title { justify-content: center; }
  .slide.type-title h1 { font-size: 104px; max-width: 1300px; }
  .slide.type-title .who { margin-top: 48px; font-size: 30px; color: var(--muted); display: flex; gap: 28px; align-items: baseline; }
  .slide.type-title .who b { color: var(--text); font-weight: 600; }

  /* statement */
  .slide.type-statement { justify-content: center; }
  .slide.type-statement h1 { font-size: 92px; max-width: 1360px; }

  /* section */
  .slide.type-section { justify-content: center; }
  .slide.type-section .kicker { font-size: 28px; }
  .slide.type-section h1 { font-size: 120px; }

  /* bullets */
  ul.big { list-style: none; padding: 0; margin: 0; font-size: 38px; line-height: 1.35; }
  ul.big li { padding: 18px 0 18px 54px; position: relative; border-top: 1px solid var(--line); }
  ul.big li:first-child { border-top: 0; }
  ul.big li::before { content: "›"; position: absolute; left: 10px; color: var(--accent); font-family: var(--mono); }
  ul.big li small { display: block; color: var(--muted); font-size: 28px; margin-top: 4px; }

  /* cards */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 30px 28px; min-height: 300px; display: flex; flex-direction: column; }
  .card .ico { font-size: 44px; margin-bottom: 18px; font-family: var(--mono); color: var(--accent); }
  .card h3 { margin: 0 0 12px; font-size: 32px; }
  .card p { margin: 0; color: var(--muted); font-size: 24px; line-height: 1.35; }
  .card .tag { margin-top: auto; padding-top: 18px; font-family: var(--mono); font-size: 20px; color: var(--purple); }
  .cards.two { grid-template-columns: 1fr 1fr; }
  .cards.two .card { min-height: 0; }
  .cards.two .card p { font-size: 28px; }
  .cards.two .card h3 { font-size: 40px; }

  /* columns */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .col h3 { font-size: 34px; margin: 0 0 18px; color: var(--accent); }
  .col ul { margin: 0; padding: 0; list-style: none; font-size: 30px; line-height: 1.4; }
  .col li + li { margin-top: 16px; }
  .col li code { font-family: var(--mono); background: var(--panel); border: 1px solid var(--line); padding: 2px 10px; border-radius: 8px; font-size: 26px; color: var(--blue); }

  /* diagram */
  .flow { display: flex; align-items: center; gap: 18px; margin: 30px 0 20px; }
  .node { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; text-align: center; flex: 1; }
  .node .n { font-family: var(--mono); font-size: 28px; color: var(--text); }
  .node .d { color: var(--muted); font-size: 22px; margin-top: 8px; }
  .node.hi { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .arrow { font-size: 44px; color: var(--accent); font-family: var(--mono); }
  .outs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 14px; }
  .outs .node .n { color: var(--purple); }
  .triple { display: flex; gap: 48px; margin-top: 44px; font-size: 40px; font-weight: 600; }
  .triple span { color: var(--green); }
  .triple span::before { content: "✔ "; }

  /* code */
  pre.code { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 32px; font-family: var(--mono); font-size: 22px; line-height: 1.4; overflow: hidden; color: var(--text); }
  .k { color: var(--blue); } .s { color: var(--green); } .c { color: var(--muted); } .h { color: var(--accent); } .sec { color: var(--purple); }

  /* terminal */
  .termwrap { flex: 1; display: grid; gap: 22px; min-height: 0; }
  .termwrap.three { grid-template-columns: repeat(3, 1fr); }
  .term { background: #0a0c11; border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .term .bar { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 20px; color: var(--muted); }
  .term .bar .dots { display: flex; gap: 8px; margin-right: 10px; }
  .term .bar .dots i { width: 14px; height: 14px; border-radius: 50%; display: block; background: #ff5f57; }
  .term .bar .dots i:nth-child(2) { background: #febc2e; } .term .bar .dots i:nth-child(3) { background: #28c840; }
  .term .bar .host { color: var(--text); }
  .term .bar .sys { margin-left: auto; color: var(--purple); }
  .term .body { flex: 1; padding: 22px 26px; font-family: var(--mono); font-size: 25px; line-height: 1.42; white-space: pre-wrap; overflow: hidden; color: #d7dee9; }
  .term.small .body { font-size: 19.5px; line-height: 1.33; }
  .termwrap.three .term .body { font-size: 18px; padding: 16px 18px; }
  .termwrap.three .term .bar { font-size: 17px; }
  .line.cmd { color: var(--text); }
  .ps { color: var(--accent); font-weight: 600; }
  .ps.flox { color: var(--purple); }
  .ok { color: var(--green); } .warn { color: var(--accent); } .info { color: var(--blue); } .dim { color: var(--muted); } .hash { color: var(--purple); } .em { color: var(--accent); }
  .cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--accent); vertical-align: -0.2em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .out { opacity: 0; animation: reveal .18s ease-out forwards; }
  @keyframes reveal { to { opacity: 1; } }
  .term .hint { position: absolute; right: 120px; bottom: 56px; font-family: var(--mono); color: var(--muted); font-size: 18px; }

  /* store path anatomy */
  .slide.type-path h2 { max-width: 1380px; }
  .storepath { font-family: var(--mono); font-size: 38px; margin: 22px 0 14px; letter-spacing: -0.01em; white-space: nowrap; }
  .storepath .pfx { color: var(--dim); }
  .storepath .nm { color: var(--text); }
  .legend { display: flex; gap: 48px; color: var(--muted); font-size: 24px; margin-bottom: 30px; }
  .legend b { font-family: var(--mono); font-weight: 600; margin-right: 10px; }
  .slide.type-path ul.big { font-size: 32px; }
  .slide.type-path ul.big li { padding: 16px 0 16px 54px; }
  .slide.type-path ul.big li code { font-family: var(--mono); color: var(--blue); font-size: 28px; }

  /* flox on nix */
  .stackwrap { display: grid; grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: start; }
  .layers { display: flex; flex-direction: column; gap: 10px; }
  .layer { background: var(--panel); border: 1px solid var(--line); border-left: 8px solid var(--line); border-radius: 14px; padding: 14px 24px; }
  .layer .n { font-family: var(--mono); font-size: 30px; }
  .layer .n small { color: var(--muted); font-size: 22px; margin-left: 14px; }
  .layer .d { color: var(--muted); font-size: 21px; line-height: 1.3; margin-top: 4px; }
  .layer.you { border-left-color: var(--accent); }
  .layer.flox { border-left-color: var(--purple); }
  .layer.nix { border-left-color: var(--blue); }
  .layer.pkgs { border-left-color: var(--green); }
  .side h3 { font-size: 28px; margin: 0 0 12px; color: var(--accent); }
  .side h3 + ul + h3 { margin-top: 30px; }
  .side ul { margin: 0; padding: 0; list-style: none; font-size: 25px; line-height: 1.45; color: var(--text); }
  .side li { padding-left: 30px; position: relative; }
  .side li::before { content: "›"; position: absolute; left: 4px; color: var(--accent); font-family: var(--mono); }

  /* open source table */
  .oss { display: grid; grid-template-columns: 240px 170px 1fr 400px; font-size: 27px; }
  .oss > div { padding: 22px 28px 22px 0; border-top: 1px solid var(--line); display: flex; align-items: center; }
  .oss > div:nth-child(-n+4) { border-top: 0; }
  .oss .name { font-weight: 600; font-size: 32px; }
  .oss .lic { font-family: var(--mono); color: var(--green); font-size: 22px; }
  .oss .what { color: var(--muted); line-height: 1.3; }
  .oss .repo { font-family: var(--mono); color: var(--blue); font-size: 22px; justify-content: flex-end; padding-right: 0; }
  .slide.type-open .foot { font-family: var(--sans); font-size: 24px; line-height: 1.35; }
  .slide.type-open .foot span:first-child { max-width: 1250px; }

  /* hud */
  #hud { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.06); }
  #hud i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  #meta { position: fixed; right: 18px; bottom: 14px; font-family: var(--mono); font-size: 14px; color: var(--muted); display: flex; gap: 18px; opacity: .85; }
  #meta b { color: var(--text); font-weight: 600; }
  #meta .late { color: var(--red); }
  #notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 38vh; background: rgba(10,12,17,.96); border-top: 1px solid var(--line); padding: 20px 36px 28px; font-size: 18px; line-height: 1.5; color: var(--text); overflow: auto; display: none; backdrop-filter: blur(8px); }
  #notes.show { display: block; }
  #notes h4 { margin: 0 0 8px; font-family: var(--mono); color: var(--accent); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
  #help { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; place-items: center; }
  #help.show { display: grid; }
  #help div { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 36px; font-family: var(--mono); font-size: 18px; line-height: 1.8; }
  #help kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; color: var(--accent); }
</style>
</head>
<body>
<div id="stage-wrap"><div id="stage"></div></div>
<div id="hud"><i></i></div>
<div id="meta"><span id="clock"></span><span id="target"></span><span id="counter"></span></div>
<div id="notes"></div>
<div id="help"><div>
  <kbd>→</kbd> <kbd>space</kbd> next step / slide &nbsp; <kbd>←</kbd> previous slide<br>
  <kbd>n</kbd> speaker notes &nbsp; <kbd>t</kbd> start / reset the talk clock &nbsp; <kbd>f</kbd> fullscreen<br>
  <kbd>home</kbd> / <kbd>end</kbd> first / last slide &nbsp; <kbd>?</kbd> this help
</div></div>

<script>
// ---------------------------------------------------------------------------
// Slide content. Every terminal output below was captured from a real run of
// this repository on 2026-10-16 with flox 1.18.0 (see README). The plain
// nix commands in the "Under the hood" section were captured on 2026-10-17
// with nix 2.31.5 against the same manifest.lock. The only emulated parts are
// the two remote machines and `flox push`, which need a FloxHub account and
// are marked in the speaker notes.
// ---------------------------------------------------------------------------
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const MANIFEST = `<span class="k">schema-version</span> = <span class="s">"1.18.0"</span>

<span class="sec">[install]</span>
<span class="k">python3</span>.pkg-path = <span class="s">"python3"</span>          <span class="c"># runtime</span>
<span class="k">python3</span>.version  = <span class="s">"3.14"</span>
<span class="k">redis</span>.pkg-path   = <span class="s">"redis"</span>            <span class="c"># database</span>
<span class="k">jq</span>.pkg-path      = <span class="s">"jq"</span>
<span class="k">claude-code</span>.pkg-path = <span class="s">"claude-code"</span>  <span class="c"># the agent's harness</span>

<span class="sec">[vars]</span>
<span class="k">APP_PORT</span>   = <span class="s">"8080"</span>
<span class="k">REDIS_PORT</span> = <span class="s">"6379"</span>

<span class="sec">[services.redis]</span>
<span class="k">command</span> = <span class="s">"redis-server --port $REDIS_PORT --dir $FLOX_ENV_CACHE/redis --save ''"</span>
<span class="sec">[services.app]</span>
<span class="k">command</span> = <span class="s">"python3 app.py"</span>

<span class="sec">[build.app]</span>
<span class="k">version</span> = <span class="s">"0.1.0"</span>
<span class="k">command</span> = <span class="s">"mkdir -p $out/bin && cp app.py $out/bin/app && chmod +x $out/bin/app"</span>
<span class="k">sandbox</span> = <span class="s">"pure"</span>                      <span class="c"># hermetic</span>
<span class="k">runtime-packages</span> = [<span class="s">"python3"</span>, <span class="s">"redis"</span>]

<span class="sec">[options]</span>
<span class="k">systems</span> = [<span class="s">"aarch64-darwin"</span>, <span class="s">"aarch64-linux"</span>, <span class="s">"x86_64-linux"</span>]`;

const REPORT_JSON = `{
  "service": "ato-demo",
  "version": "0.1.0",
  "python": "3.14.7",
  "system": "arm64-darwin",
  "flox_env": "~/deterministic-builds-google/.flox/run/aarch64-darwin.deterministic-builds-google-dev",

jq: jq (1.8.2)
python3: python3 (3.14.7)
redis: redis (8.10.2)`;

const slides = [
  // 0 ------------------------------------------------------------- 0:00
  { type: 'title', t: 0,

    title: 'One Environment,<br>N Machines',
    sub: 'Deterministic builds for humans <em>and</em> agents',

  { type: 'cards', t: 1,

    cards: [
      { ico: '⌨', h: 'A laptop', p: 'Set up by a person. Slowly. Once. Then drifted for two years.', tag: 'set up by: a human' },

      { ico: '▣', h: 'A local sandbox', p: 'Set up by a container image someone built, somewhere, from a Dockerfile nobody reads.', tag: 'set up by: an image' },
      { ico: '✦', h: 'A remote sandbox', p: 'Set up by the agent that is about to run your tests in it. It is guessing.', tag: 'set up by: the agent' },
    ],
    foot: ['Four machines, four setup stories, one codebase.', '1:00'],
    notes: `Walk the four cards left to right. The punchline is the fourth card: the machine is now set up by the thing that is about to use it. <b>Hold until ~2:30.</b>` },

  // 2 ------------------------------------------------------------- 2:30
  { type: 'statement', t: 2.5,
    title: 'Nobody sets these machines up by hand anymore.',
    sub: 'And when they do, every one of them does it a little differently.',
    notes: `One beat. Let it land. Then: "so what does setup actually look like today?" and advance.` },

  // 3 ------------------------------------------------------------- 3:00
  { type: 'code', t: 3,
    kicker: 'Setup, today',
    title: 'Four machines, four install stories',
    code: `<span class="c"># macOS</span>

    foot: ['Three Pythons, two Redises, and a curl | sh. Same repo.', '3:00'],

  // 4 ------------------------------------------------------------- 4:30
  { type: 'cards2', t: 4.5,

      { h: '2. Same run, wherever it lands next', p: 'Another runner, a container, production, or six months from now. The artifact carries its own closure, so it does not depend on what the host happened to have.' },

/nix/store/phb97pafnka8z1qpj12is214rshpql65-zlib-1.3.2
/nix/store/0k4r9hnfbnyngn5f3j31siddfs0iglwl-sqlite-3.53.3

/nix/store/8kn5h4pkns2wf662nvifg08vvz41c0dl-zstd-1.5.7
/nix/store/9496m45iskps77ngzq2i16a7snig4dx9-xz-5.8.4` },
      { cmd: 'nix-store -q --requisites /nix/store/0kcws5blwbdyxqxjd1w8hjipz61xny3k-python3-3.14.7 | wc -l',

    case 'term': {
      const wrap = document.createElement('div'); wrap.className = 'termwrap';
      const te = termEl(s.host, s.sys, s.cwd); if (s.small) te.classList.add('small'); wrap.appendChild(te); el.appendChild(wrap);
      const h = document.createElement('div'); h.className = 'hint'; h.textContent = '→ to run the next command'; el.appendChild(h);
      break; }
    case 'term3': {
      const wrap = document.createElement('div'); wrap.className = 'termwrap three';
      s.panes.forEach(p => wrap.appendChild(termEl(p.host, p.sys, '~'))); el.appendChild(wrap);
      const h = document.createElement('div'); h.className = 'hint'; h.textContent = '→ to run the next command'; el.appendChild(h);
      break; }
  }
  el.dataset.index = i;
  return el;
}
slides.forEach((s, i) => stage.appendChild(render(s, i)));
const slideEls = [...stage.children];

// ---------------------------------------------------------------------------
// Terminal playback
// ---------------------------------------------------------------------------
const state = { i: 0, step: 0, typing: null };
const TYPE_MS = 22;

function promptHtml(kind) {
  return kind === 'flox' ? `<span class="ps flox">[flox] $</span> ` : `<span class="ps">$</span> `;
}

function bodies(i) { return [...slideEls[i].querySelectorAll('.term .body')]; }

function currentPrompt(s, stepIdx) {
  let ps = 'plain';
  for (let k = 0; k < stepIdx; k++) if (s.steps[k].ps) ps = s.steps[k].ps;
  return ps;
}

function appendCmd(body, ps, text, instant, done) {
  const line = document.createElement('div'); line.className = 'line cmd';
  line.innerHTML = promptHtml(ps) + '<span class="typed"></span><span class="cursor"></span>';
  body.appendChild(line);
  const slot = document.createElement('div'); body.appendChild(slot);   // output lands here, in order
  body.scrollTop = body.scrollHeight;
  const typed = line.querySelector('.typed');
  let finished = false;
  const finish = () => { if (finished) return; finished = true; const c = line.querySelector('.cursor'); if (c) c.remove(); typed.textContent = text; done(slot); };
  if (instant) { finish(); return () => {}; }
  let n = 0;
  const id = setInterval(() => {
    n++; typed.textContent = text.slice(0, n);
    body.scrollTop = body.scrollHeight;
    if (n >= text.length) { clearInterval(id); finish(); }
  }, TYPE_MS);
  return () => { clearInterval(id); finish(); };
}

function fillOut(body, slot, html, slow) {
  slot.className = 'out';
  slot.innerHTML = html;
  if (slow) slot.style.animationDuration = '.6s';
  body.scrollTop = body.scrollHeight;
}

function runStep(i, k, instant) {
  const s = slides[i];
  const bs = bodies(i);
  const step = s.steps[k];
  const ps = currentPrompt(s, k);
  let pending = bs.length;
  const timers = [];
  const finishers = bs.map((b, idx) => appendCmd(b, ps, step.cmd, instant, (slot) => {
    const html = Array.isArray(step.out) ? step.out[idx] : step.out;
    if (instant) fillOut(b, slot, html, step.slow);
    else timers.push(setTimeout(() => fillOut(b, slot, html, step.slow), 140));
    if (--pending === 0) state.typing = null;
  }));
  if (!instant) state.typing = () => { finishers.forEach(f => f()); timers.forEach(clearTimeout); bs.forEach((b, idx) => { const slot = b.lastElementChild; if (slot && !slot.classList.contains('out')) fillOut(b, slot, Array.isArray(step.out) ? step.out[idx] : step.out, step.slow); }); };
}

function resetTerm(i) { bodies(i).forEach(b => b.innerHTML = ''); }

function showAllSteps(i) {
  const s = slides[i]; if (!s.steps) return;
  resetTerm(i);
  s.steps.forEach((_, k) => runStep(i, k, true));
  state.step = s.steps.length;
}

// ---------------------------------------------------------------------------
// Navigation
// ---------------------------------------------------------------------------
function show(i, opts = {}) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (state.typing) { state.typing(); state.typing = null; }
  slideEls.forEach(el => el.classList.remove('active'));
  slideEls[i].classList.add('active');
  state.i = i; state.step = 0;
  if (slides[i].steps) { if (opts.complete) showAllSteps(i); else resetTerm(i); }
  location.hash = `#${i + 1}`;
  document.getElementById('hud').firstElementChild.style.width = `${((i + 1) / slides.length) * 100}%`;
  document.getElementById('counter').textContent = `${i + 1} / ${slides.length}`;
  document.getElementById('target').textContent = `target ${fmt(slides[i].t)}`;
  document.getElementById('notes').innerHTML = `<h4>Notes · slide ${i + 1} · target ${fmt(slides[i].t)}</h4>${slides[i].notes || ''}`;
  const hint = slideEls[i].querySelector('.hint'); if (hint) hint.style.display = '';
}

function next() {
  const s = slides[state.i];
  if (state.typing) { state.typing(); state.typing = null; return; }
  if (s.steps && state.step < s.steps.length) {
    runStep(state.i, state.step, false); state.step++;
    if (state.step === s.steps.length) { const h = slideEls[state.i].querySelector('.hint'); if (h) h.style.display = 'none'; }
    return;
  }
  if (state.i < slides.length - 1) show(state.i + 1);
}
function prev() { if (state.i > 0) show(state.i - 1, { complete: true }); }

// Talk clock
let t0 = null;
function tick() {
  const c = document.getElementById('clock');
  if (!t0) { c.textContent = 'clock: press t'; c.className = ''; return; }
  const m = (Date.now() - t0) / 60000;
  c.innerHTML = `<b>${fmt(m)}</b>`;
  c.className = m > slides[state.i].t + 1 ? 'late' : '';
}
setInterval(tick, 1000);

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key) {
    case 'ArrowRight': case ' ': case 'Enter': case 'PageDown': e.preventDefault(); next(); break;
    case 'ArrowLeft': case 'PageUp': case 'Backspace': e.preventDefault(); prev(); break;
    case 'Home': show(0); break;
    case 'End': show(slides.length - 1, { complete: true }); break;
    case 'n': document.getElementById('notes').classList.toggle('show'); break;
    case 't': t0 = t0 ? null : Date.now(); tick(); break;
    case 'f': document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); break;
    case '?': document.getElementById('help').classList.toggle('show'); break;
    case 'Escape': document.getElementById('help').classList.remove('show'); break;
  }
});
document.getElementById('help').addEventListener('click', () => document.getElementById('help').classList.remove('show'));
stage.addEventListener('click', e => { if (e.clientX > window.innerWidth / 2) next(); else prev(); });

// Scale the 1600x900 stage to the window
function fit() {
  const k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
  stage.style.transform = `scale(${k})`;
}
window.addEventListener('resize', fit); fit();

const start = parseInt((location.hash || '#1').slice(1), 10) - 1;
show(isNaN(start) ? 0 : start);
tick();
</script>
</body>
</html>
